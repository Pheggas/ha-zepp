sync_history:
  name: Sync history
  description: >-
    Import historical days from the Zepp cloud into Home Assistant statistics.
    Safe to run repeatedly: the same day always produces the same rows.
  fields:
    days:
      name: Days
      description: How far back to import.
      default: 90
      selector:
        number:
          min: 1
          max: 1825
          unit_of_measurement: days
          mode: box
